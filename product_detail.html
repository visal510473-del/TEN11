<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product detail</title>
<style>
:root{--ink:#000000;--muted:#6b6b6b;--line:#e4e4e4;--chip:#f1f2f6;--btn:#1c1c1c;--btn-off:#8a8a8a;--bg:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg)}
.navbar{position:sticky;top:0;z-index:20;width:100%;height:58px;padding:0 10.5%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:#fff;border-bottom:1px solid #eee;font-family:Arial,Helvetica,sans-serif}
.nav-left{justify-self:start}
.logo{justify-self:center;color:#000;font-size:27px;font-weight:900;letter-spacing:-1.5px;text-decoration:none;white-space:nowrap}
.logo-dot{font-size:11px;vertical-align:middle;margin:0 1px}
.nav-right{justify-self:end;display:flex;align-items:center;gap:19px}
.icon-btn{position:relative;display:flex;align-items:center;justify-content:center;padding:2px;border:0;background:none;color:#333;cursor:pointer}
.icon-btn:hover{color:#888}
.icon-btn svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cart-count{position:absolute;top:-7px;right:-9px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:#e8336d;color:#fff;font-size:11px;line-height:19px;text-align:center}
.cart-overlay{position:fixed;inset:0;z-index:39;background:#0008}
.cart-overlay[hidden],.cart-panel[hidden]{display:none}
.cart-panel{position:fixed;top:0;right:0;bottom:0;z-index:40;display:flex;flex-direction:column;width:min(390px,100vw);padding:22px 24px 18px;background:#fff;box-shadow:-5px 0 20px #00000020;transform:translateX(100%);transition:transform .25s ease;font-family:Arial,Helvetica,sans-serif}
.cart-panel.open{transform:translateX(0)}
.cart-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
.cart-panel h2{font-size:23px}
.cart-close{border:0;background:none;color:#555;cursor:pointer;font-size:25px;line-height:1}
.cart-items{flex:1;overflow-y:auto}
.cart-entry{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #eee;font-size:13px}
.cart-entry img{width:64px;height:80px;object-fit:cover;background:#eee}
.cart-entry-info{flex:1;min-width:0}
.cart-entry strong{display:block}
.cart-entry p{margin-top:4px;color:#666;font-size:12px}
.cart-entry-price{margin-top:5px;font-size:14px}
.cart-remove{align-self:center;border:0;background:none;color:#d94a4a;cursor:pointer;font-size:20px}
.cart-empty{padding:14px 0;color:#666;font-size:13px}
.cart-footer{border-top:1px solid #eee;padding-top:18px}
.cart-subtotal{display:flex;justify-content:space-between;margin-bottom:18px;font-size:15px;font-weight:700}
.checkout-btn{width:100%;height:48px;border:0;border-radius:3px;background:#000;color:#fff;font-size:15px;font-weight:700;letter-spacing:1px;cursor:pointer}
.checkout-btn:disabled{background:#888;cursor:not-allowed}
body.cart-open{overflow:hidden}
.side-menu{position:fixed;top:58px;left:0;z-index:30;width:280px;height:calc(100vh - 58px);padding:25px;background:#fff;box-shadow:3px 5px 15px #00000020;transform:translateX(-110%);transition:transform .3s ease;font-family:Arial,Helvetica,sans-serif}
.side-menu.active{transform:translateX(0)}
.side-menu a{display:block;padding:16px 0;border-bottom:1px solid #eee;color:#111;font-size:15px;text-decoration:none}
.side-menu a:hover{color:#777}
.menu-overlay{position:fixed;inset:58px 0 0;z-index:25;background:#00000055}
.menu-overlay[hidden]{display:none}
.menu-btn[aria-expanded=true]{color:#111}
.wrap{max-width:1300px;margin:0 auto;padding:10px 16px;display:grid;grid-template-columns:minmax(0,620px) minmax(0,580px);gap:30px;justify-content:center}
.gallery{position:relative;background:#e8ecef;aspect-ratio:619/793}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.next,.prev{position:absolute;top:50%;transform:translateY(-50%);background:none;border:0;font-size:28px;cursor:pointer;padding:8px}
.next{right:6px}.prev{left:6px}
.home-link{display:flex;align-items:center;justify-content:center;width:100%;height:40px;margin-top:-16px;margin-bottom:24px;border:0;border-radius:4px;background:var(--btn);color:#fff;text-decoration:none;font-size:15px;font-weight:600}
.head{display:flex;justify-content:space-between;align-items:flex-start}
h1{font-size:16px;font-weight:400;margin:0 0 8px}
.price{font-weight:600;font-size:16px;margin:0 0 28px}
.label{font-weight:600;font-size:16px;margin:0 0 10px}
.color-options{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:98px;padding:2px;border:2px solid transparent;background:#fff;text-align:center;font-size:13px;font-weight:600;cursor:pointer}
.swatch[aria-pressed=true]{border-color:#1c1c1c}
.swatch:focus-visible{outline:2px solid #2a6df4;outline-offset:2px}
.swatch img{width:90px;height:120px;object-fit:cover;display:block;margin-bottom:6px}
.swatch-color{display:block;width:90px;height:40px;border:1px solid #dcdde3;margin-bottom:6px}
.sizes{display:flex;gap:6px;flex-wrap:wrap;margin:28px 0 16px}
.sizes button{background:var(--chip);border:1px solid #dcdde3;border-radius:4px;min-width:62px;height:38px;padding:0 14px;font-size:14px;cursor:pointer;color:var(--ink)}
.sizes button[aria-pressed=true]{border-color:var(--ink);background:#fff}
.quantity-row{display:flex;align-items:center;gap:14px;margin:20px 0}
.quantity-row label{font-size:14px;font-weight:600}
.quantity-control{display:flex;height:38px;border:1px solid #dcdde3;border-radius:4px;overflow:hidden}
.quantity-control button{width:38px;border:0;background:var(--chip);font-size:20px;cursor:pointer}
.quantity-control input{width:48px;border:0;border-left:1px solid #dcdde3;border-right:1px solid #dcdde3;text-align:center;font-size:14px;appearance:textfield}
.quantity-control input::-webkit-inner-spin-button,.quantity-control input::-webkit-outer-spin-button{appearance:none;margin:0}
.quantity-control button:disabled{color:#999;cursor:not-allowed}
.home-link:focus-visible,.sizes button:focus-visible,.quantity-control button:focus-visible,.quantity-control input:focus-visible,.add:focus-visible,.fav:focus-visible,summary:focus-visible{outline:2px solid #2a6df4;outline-offset:2px}
.actions{display:flex;gap:8px;margin-bottom:24px}
.add{flex:1;height:40px;border:0;border-radius:4px;background:var(--btn-off);color:#fff;font-weight:600;font-size:15px;cursor:not-allowed}
.add.ready{background:var(--btn);cursor:pointer}
.fav{width:42px;height:40px;border:1px solid var(--ink);border-radius:4px;background:#fff;cursor:pointer;font-size:18px}
.fav[aria-pressed=true]{color:#c0262d}
#msg{font-size:13px;color:var(--muted);min-height:18px;margin:-12px 0 12px}
.add:disabled{background:var(--btn-off);cursor:not-allowed}
.bag{border:1px solid var(--line);border-radius:4px;padding:16px;margin:0 0 24px}
.bag h2{font-size:16px;margin:0 0 12px}
.bag-item{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.bag-item p{margin:4px 0 0;color:var(--muted);font-size:13px}
.bag-total{display:flex;justify-content:space-between;margin-top:14px;font-weight:600}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;padding:18px 0;font-weight:600;font-size:16px}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:8px;height:8px;border:solid var(--muted);border-width:0 1.5px 1.5px 0;transform:rotate(45deg);transition:transform .2s;margin-top:4px}
details[open] summary::after{transform:rotate(225deg)}
details p,details ul{margin:0 0 18px;font-size:14px;line-height:1.6;color:#333}
details ul{padding-left:18px}
@media(max-width:860px){.wrap{grid-template-columns:1fr}}
@media(max-width:768px){.navbar{padding:0 18px}.logo{font-size:22px}.nav-right{gap:12px}.icon-btn svg{width:20px;height:20px}}
@media(max-width:380px){.navbar{padding:0 10px}.logo{font-size:18px}.nav-right{gap:8px}}
</style>
</head>
<body>
<nav class="navbar" aria-label="Main navigation">
  <div class="nav-left">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="sideMenu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h16"></path></svg>
    </button>
  </div>
  <a href="index.html" class="logo" aria-label="TEN ELEVEN home">TEN<span class="logo-dot">●</span>ELEVEN</a>
  <div class="nav-right">
    <button class="icon-btn" type="button" aria-label="Search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m16 16 5 5"></path></svg>
    </button>
    <button class="icon-btn" type="button" aria-label="Notifications">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path><path d="M10 21h4"></path></svg>
    </button>
    <button class="icon-btn" id="cartBtn" type="button" aria-label="Bag, 0 items" aria-expanded="false" aria-controls="cartPanel">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 13H6L5 8z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>
      <span class="cart-count" id="cartCount" hidden>0</span>
    </button>
    <button class="icon-btn" type="button" aria-label="Profile">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="4"></circle><path d="M5 21v-2a7 7 0 0 1 14 0v2"></path></svg>
    </button>
  </div>
</nav>
<div class="side-menu" id="sideMenu" hidden>
  <a href="index.html">HOME</a>
  <a href="men.html">SHOP MEN</a>
  <a href="women.html">SHOP WOMEN</a>
  <a href="index.html">NEW ARRIVALS</a>
  <a href="index.html">SALE</a>
  <a href="index.html">CONTACT</a>
</div>
<div class="menu-overlay" id="menuOverlay" hidden></div>
<div class="cart-overlay" id="cartOverlay" hidden></div>
<aside class="cart-panel" id="cartPanel" aria-label="Your bag" aria-hidden="true" hidden>
  <div class="cart-header">
    <h2>Your Bag</h2>
    <button class="cart-close" id="cartClose" type="button" aria-label="Close bag">&times;</button>
  </div>
  <div class="cart-items" id="cartEntries"></div>
  <div class="cart-footer">
    <div class="cart-subtotal"><span>Total:</span><span id="cartSubtotal">$0.00</span></div>
    <button class="checkout-btn" id="checkoutBtn" type="button" disabled>CHECKOUT</button>
  </div>
</aside>
<main class="wrap" id="app"></main>
<script>
// Product data. A listing page links here with: product_detail.html?id=gothic-tee
const PRODUCTS = {
  "gothic-tee": {
    name: "Gothic Graphic Oversized Cotton Tee",
    price: 17.59,
    images: ["images/gothic-tee.jpg"],
    colors: [{name: "White", thumb: "images/gothic-tee-white.jpg"}],
    sizes: ["XS","S","M","L","XL","XXL"],
    model: "Model is 180 cm tall and wears size M.",
    description: ["Oversized fit with dropped shoulders","Gothic lettering graphic on the chest","100% cotton, mid-weight jersey","Layered black sleeve detail","Machine wash cold, do not tumble dry"]
  }
};
const id = new URLSearchParams(location.search).get("id") || "gothic-tee";
const q = new URLSearchParams(location.search);
let p = PRODUCTS[id] || PRODUCTS["gothic-tee"];
if (q.get("name")) {            // opened from a product card on the home page
  const cols = (q.get("colors") || "").split("|").filter(Boolean);
  p = {...PRODUCTS["gothic-tee"], name: q.get("name"), images: [q.get("img")],
    price: parseFloat((q.get("sale") || "").replace("$","")) || 0,
    old: q.get("old"), off: q.get("off"),
    colors: cols.map((c,i) => ({name: "Color " + (i+1), css: c})),
    model: "Model info is not available for this item.",
    description: ["Regular fit","Soft everyday fabric","Machine wash cold"]};
}
document.title = p.name;
let img = 0, size = null, selectedColor = null;
const bagKey = "ten11-bag";
const loadBag = () => {
  try {
    const items = JSON.parse(localStorage.getItem(bagKey) || "[]");
    return Array.isArray(items) ? items : [];
  } catch (error) {
    console.error("Could not read the shopping bag from storage.", error);
    return [];
  }
};
const bagItems = loadBag();
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const renderNavCart = () => {
  const itemCount = bagItems.reduce((sum, item) => sum + (Number(item.quantity) || 1), 0);
  const count = document.getElementById("cartCount");
  count.textContent = itemCount;
  count.hidden = itemCount === 0;
  document.getElementById("cartBtn").setAttribute("aria-label", `Bag, ${itemCount} ${itemCount === 1 ? "item" : "items"}`);
  document.getElementById("cartEntries").innerHTML = bagItems.length
    ? bagItems.map((item, index) => `<div class="cart-entry">${item.image ? `<img src="${esc(item.image)}" alt="">` : ""}<div class="cart-entry-info"><strong>${esc(item.name)}</strong><p>Size: ${esc(item.size)}${item.color ? ` | Color: ${esc(item.color)}` : ""}</p><strong class="cart-entry-price">$${Number(item.price).toFixed(2)}${Number(item.quantity) > 1 ? ` × ${Number(item.quantity)}` : ""}</strong></div><button class="cart-remove" type="button" data-remove-index="${index}" aria-label="Remove ${esc(item.name)} from bag">&#128465;</button></div>`).join("")
    : '<p class="cart-empty">Your bag is empty.</p>';
  const total = bagItems.reduce((sum, item) => sum + (Number(item.price) || 0) * (Number(item.quantity) || 1), 0);
  document.getElementById("cartSubtotal").textContent = "$" + total.toFixed(2);
  document.getElementById("checkoutBtn").disabled = bagItems.length === 0;
};
const menuBtn = document.getElementById("menuBtn");
const sideMenu = document.getElementById("sideMenu");
const menuOverlay = document.getElementById("menuOverlay");
let menuCloseTimer;
const closeMenu = () => {
  sideMenu.classList.remove("active");
  menuOverlay.classList.remove("active");
  menuBtn.setAttribute("aria-expanded", "false");
  menuBtn.setAttribute("aria-label", "Open menu");
  menuCloseTimer = setTimeout(() => {
    sideMenu.hidden = true;
    menuOverlay.hidden = true;
  }, 300);
};
menuBtn.addEventListener("click", () => {
  if (!sideMenu.hidden) {
    closeMenu();
    return;
  }
  clearTimeout(menuCloseTimer);
  sideMenu.hidden = false;
  menuOverlay.hidden = false;
  requestAnimationFrame(() => {
    sideMenu.classList.add("active");
    menuOverlay.classList.add("active");
  });
  menuBtn.setAttribute("aria-expanded", "true");
  menuBtn.setAttribute("aria-label", "Close menu");
});
menuOverlay.addEventListener("click", closeMenu);

const cartBtn = document.getElementById("cartBtn");
const cartPanel = document.getElementById("cartPanel");
const cartOverlay = document.getElementById("cartOverlay");
let cartCloseTimer;
const closeCart = () => {
  cartPanel.classList.remove("open");
  cartBtn.setAttribute("aria-expanded", "false");
  cartPanel.setAttribute("aria-hidden", "true");
  document.body.classList.remove("cart-open");
  cartCloseTimer = setTimeout(() => {
    cartPanel.hidden = true;
    cartOverlay.hidden = true;
  }, 250);
};
cartBtn.addEventListener("click", () => {
  renderNavCart();
  clearTimeout(cartCloseTimer);
  cartPanel.hidden = false;
  cartOverlay.hidden = false;
  requestAnimationFrame(() => cartPanel.classList.add("open"));
  cartBtn.setAttribute("aria-expanded", "true");
  cartPanel.setAttribute("aria-hidden", "false");
  document.body.classList.add("cart-open");
});
document.getElementById("cartClose").addEventListener("click", closeCart);
cartOverlay.addEventListener("click", closeCart);
document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    if (!cartPanel.hidden) closeCart();
    if (!sideMenu.hidden) closeMenu();
  }
});
document.getElementById("cartEntries").addEventListener("click", event => {
  const removeButton = event.target.closest("[data-remove-index]");
  if (!removeButton) return;
  const updatedItems = [...bagItems];
  updatedItems.splice(Number(removeButton.dataset.removeIndex), 1);
  try {
    localStorage.setItem(bagKey, JSON.stringify(updatedItems));
    bagItems.splice(0, bagItems.length, ...updatedItems);
    renderBag();
    renderNavCart();
  } catch (error) {
    console.error("Could not remove the item from the shopping bag.", error);
  }
});
document.getElementById("checkoutBtn").addEventListener("click", () => {
  if (bagItems.length) location.href = "checkout.html";
});
window.addEventListener("storage", event => {
  if (event.key !== bagKey) return;
  bagItems.splice(0, bagItems.length, ...loadBag());
  renderBag();
  renderNavCart();
});

document.getElementById("app").innerHTML = `
<div class="gallery">
  <img id="photo" src="${esc(p.images[0])}" alt="${esc(p.name)}">
  ${p.images.length > 1 ? '<button class="prev" aria-label="Previous image">&#8249;</button>' : ''}
  ${p.images.length > 1 ? '<button class="next" aria-label="Next image">&#8250;</button>' : ''}
</div>
<section>
  <div class="head"><h1>${esc(p.name)}</h1>
    <button class="fav" style="border:0;width:auto" aria-label="Share" onclick="navigator.share&&navigator.share({title:document.title,url:location.href})">&#8599;</button></div>
  <p class="price">${p.old ? `<span style="text-decoration:line-through;font-weight:400;color:var(--muted)">${esc(p.old)}</span> ${esc(p.off||"")} <span style="color:#e8336d">$${p.price.toFixed(2)}</span>` : "$" + p.price.toFixed(2)}</p>
  <p class="label">Color</p>
  <div class="color-options" role="group" aria-label="Color">
    ${p.colors.map((c, i) => `<button type="button" class="swatch" data-color-index="${i}" aria-pressed="false" aria-label="${esc(c.name)}">${c.css ? `<span class="swatch-color" style="background:${esc(c.css)}"></span>${esc(c.name)}` : `<img src="${esc(c.thumb)}" alt="">${esc(c.name)}`}</button>`).join("")}
  </div>
  <p class="label" style="margin-top:28px;font-weight:500">Please select one size</p>
  <div class="sizes" role="group" aria-label="Size" style="margin-top:0">
    ${p.sizes.map(s => `<button type="button" aria-pressed="false">${esc(s)}</button>`).join("")}
  </div>
  <div class="quantity-row">
    <label for="quantity">Quantity</label>
    <div class="quantity-control">
      <button type="button" id="quantityDown" aria-label="Decrease quantity" disabled>&minus;</button>
      <input type="number" id="quantity" min="1" step="1" value="1" inputmode="numeric">
      <button type="button" id="quantityUp" aria-label="Increase quantity">+</button>
    </div>
  </div>
  <div id="msg" role="status"></div>
  <div class="actions">
    <button class="add" id="add" disabled>Add to bag</button>
    <button class="fav" id="fav" aria-pressed="false" aria-label="Add to wishlist">&#9825;</button>
  </div>
  <section class="bag" id="bag" aria-live="polite" hidden>
    <h2>Your bag</h2>
    <div id="bag-items"></div>
    <div class="bag-total"><span>Subtotal</span><span id="bag-total"></span></div>
  </section>
  <a class="home-link" href="index.html">Home</a>
  <details><summary>Model Info</summary><p>${esc(p.model)}</p></details>
  <details><summary>Description</summary><ul>${p.description.map(d => `<li>${esc(d)}</li>`).join("")}</ul></details>
</section>`;

const add = document.getElementById("add"), msg = document.getElementById("msg");
const hasColors = p.colors.length > 0;
const quantityInput = document.getElementById("quantity");
const quantityDown = document.getElementById("quantityDown");
const quantityUp = document.getElementById("quantityUp");
const getQuantity = () => {
  const quantity = Number(quantityInput.value);
  return Number.isSafeInteger(quantity) && quantity >= 1 ? quantity : null;
};
const updateQuantityControls = () => {
  const quantity = getQuantity();
  quantityDown.disabled = quantity === null || quantity <= 1;
  quantityUp.disabled = quantity === null || quantity >= Number.MAX_SAFE_INTEGER;
  updateAddButton();
};
const renderBag = () => {
  const bag = document.getElementById("bag");
  document.getElementById("bag-items").innerHTML = bagItems.map(item =>
    `<div class="bag-item"><div><strong>${esc(item.name)}</strong><p>${item.color ? `Color: ${esc(item.color)} · ` : ""}Size: ${esc(item.size)}</p></div><strong>$${Number(item.price).toFixed(2)}${Number(item.quantity) > 1 ? ` × ${Number(item.quantity)}` : ""}</strong></div>`
  ).join("");
  const total = bagItems.reduce((sum, item) => sum + (Number(item.price) || 0) * (Number(item.quantity) || 1), 0);
  document.getElementById("bag-total").textContent = "$" + total.toFixed(2);
  bag.hidden = bagItems.length === 0;
};
renderBag();
renderNavCart();
const updateAddButton = () => {
  const ready = Boolean(size) && (!hasColors || selectedColor !== null) && getQuantity() !== null;
  add.disabled = !ready;
  add.classList.toggle("ready", ready);
};
quantityDown.onclick = () => {
  const quantity = getQuantity();
  if (quantity !== null && quantity > 1) quantityInput.value = String(quantity - 1);
  updateQuantityControls();
};
quantityUp.onclick = () => {
  const quantity = getQuantity();
  if (quantity !== null && quantity < Number.MAX_SAFE_INTEGER) quantityInput.value = String(quantity + 1);
  updateQuantityControls();
};
quantityInput.addEventListener("input", () => {
  msg.textContent = "";
  updateQuantityControls();
});
quantityInput.addEventListener("change", () => {
  if (getQuantity() === null) quantityInput.value = "1";
  updateQuantityControls();
});
updateQuantityControls();
document.querySelectorAll(".swatch").forEach(b => b.onclick = () => {
  document.querySelectorAll(".swatch").forEach(x => x.setAttribute("aria-pressed", "false"));
  b.setAttribute("aria-pressed", "true");
  selectedColor = p.colors[Number(b.dataset.colorIndex)];
  msg.textContent = "";
  updateAddButton();
});
document.querySelectorAll(".sizes button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".sizes button").forEach(x => x.setAttribute("aria-pressed", "false"));
  b.setAttribute("aria-pressed", "true");
  size = b.textContent;
  msg.textContent = "";
  updateAddButton();
});
add.onclick = () => {
  if (!size || (hasColors && !selectedColor)) {
    msg.textContent = !selectedColor && hasColors
      ? "Select a color to add this to your bag."
      : "Select a size to add this to your bag.";
    return;
  }
  const quantity = getQuantity();
  if (quantity === null) {
    msg.textContent = "Enter a quantity of 1 or more.";
    return;
  }
  const item = {name: p.name, color: selectedColor ? selectedColor.name : null, size, price: p.price, image: p.images[0]};
  let existingItem = null;
  let previousQuantity = 0;
  try {
    existingItem = bagItems.find(existing =>
      existing.name === item.name && existing.color === item.color &&
      existing.size === item.size && existing.price === item.price && existing.image === item.image
    );
    if (existingItem) {
      previousQuantity = Number(existingItem.quantity) || 1;
      if (!Number.isSafeInteger(previousQuantity + quantity)) {
        msg.textContent = "The requested quantity is too large.";
        return;
      }
      existingItem.quantity = previousQuantity + quantity;
    } else {
      existingItem = {...item, quantity};
      bagItems.push(existingItem);
    }
    localStorage.setItem(bagKey, JSON.stringify(bagItems));
  } catch (error) {
    if (previousQuantity) {
      existingItem.quantity = previousQuantity;
    } else {
      const addedIndex = bagItems.indexOf(existingItem);
      if (addedIndex !== -1) bagItems.splice(addedIndex, 1);
    }
    console.error("Could not save the item to the shopping bag.", error);
    msg.textContent = "Could not add this item to your bag. Please try again.";
    return;
  }
  renderBag();
  renderNavCart();
  msg.textContent = "Added to your bag.";
};
const fav = document.getElementById("fav");
fav.onclick = () => {
  const on = fav.getAttribute("aria-pressed") !== "true";
  fav.setAttribute("aria-pressed", on); fav.innerHTML = on ? "&#9829;" : "&#9825;";
};
const show = d => { img = (img + d + p.images.length) % p.images.length; document.getElementById("photo").src = p.images[img]; };
document.querySelector(".next")?.addEventListener("click", () => show(1));
document.querySelector(".prev")?.addEventListener("click", () => show(-1));
</script>
